name: CI

on:
  pull_request:
    branches: [ main ]
  # Release-workflowen kaller denne for kandidat-SHA-en sin, og venter på hele
  # grafen før den publiserer. Derfor ingen egen push-trigger: på main er det
  # release.yml som starter CI, og da finnes det bare én kjøring som gjelder
  # nettopp den commiten. To kjøringer av samme ting er to svar å velge mellom.
  workflow_call:

# HACS- og Hassfest-valideringen hører hjemme her, ikke i egne workflows.
# Release venter på denne grafen, og det den ikke ser, kan den ikke vente på
# (stromkalkulator-2dobu6k). De samme to kjøres også nattlig fra validate.yml og
# hassfest.yml, fordi begge kan bli røde av endringer utenfor repoet.
#
# CI kaller de samme just-oppskriftene som kjøres lokalt og av pre-commit.
# Kommandolinjene står ett sted, i justfile, og tests/test_testkommandoer.py
# feller byggingen hvis dokumentasjonen sier noe annet enn oppskriftene.
#
# Actionversjonene er pinnet til majortagg der en majortagg finnes, og de er
# gjennomgått i stromkalkulator-3m5o02u. To avvik som skal stå:
#
#   setup-uv er pinnet til en eksakt versjon, ikke `@v10`. Astral sluttet å
#   publisere major- og minortagger fra og med v8.0.0, nettopp for å unngå
#   tj-actions-angrepet, så `@v8` og oppover finnes ikke. `@v7` finnes, men er
#   frossen siden mars 2026 og får ingen fikser. Eksakt versjon må derfor
#   bumpes for hånd; ikke skriv den om til en majortagg som ikke finnes.
#
#   codecov-action står på v6 fordi v6- og v7-taggene peker på samme commit.
#   v6.0.2 er ifølge Codecov selv «a copy of the v7.0.0 release», så bumpen er
#   et rent navnebytte.

jobs:
  test-unit:
    name: Unit (stubbet HA)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Set up just
        uses: extractions/setup-just@v4

      - name: Run unit tests with coverage
        run: just test-unit --cov=custom_components/stromkalkulator --cov-report=xml --cov-report=term-missing

      # Coverage-tallet er nyttig, men det er ikke en test. Nå som release.yml
      # venter på denne jobben, ville et ustabilt opplastingssteg blokkert en
      # release som ellers er grønn. `fail_ci_if_error: false` dekker feil
      # Codecov selv rapporterer; continue-on-error dekker resten, som at
      # actionen ikke svarer i det hele tatt.
      - name: Upload coverage to Codecov
        continue-on-error: true
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  check:
    name: Kvalitet (ruff, mypy, vulture)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Set up just
        uses: extractions/setup-just@v4

      - name: Lint, format, typer og død kode
        run: just check

      - name: Validate manifest
        run: |
          jq empty custom_components/stromkalkulator/manifest.json || exit 1

      - name: Check version consistency
        run: |
          VERSION=$(jq -r '.version' custom_components/stromkalkulator/manifest.json)
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Ugyldig versjonsformat i manifest.json: $VERSION"
            exit 1
          fi
          PYPROJECT_VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [[ "$VERSION" != "$PYPROJECT_VERSION" ]]; then
            echo "Versjonsdrift: manifest.json ($VERSION) != pyproject.toml ($PYPROJECT_VERSION)"
            exit 1
          fi

      # release.yml bygger release-body-en fra CHANGELOG.md. Mangler seksjonen,
      # feiler release-jobben etter at CI er grønn, og det er et dårlig sted å
      # oppdage det. Sjekkes bare når taggen ikke finnes fra før, altså når den
      # bumpede versjonen er på vei ut (stromkalkulator-1dk4).
      - name: Check changelog section for unreleased version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(jq -r '.version' custom_components/stromkalkulator/manifest.json)
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v$VERSION er alt sluppet, CHANGELOG-seksjonen er historikk"
            exit 0
          fi
          if ! python3 scripts/release_notes.py "$VERSION" >/dev/null; then
            echo "CHANGELOG.md mangler release-noten for v$VERSION"
            exit 1
          fi

  test-ha:
    name: Ekte HA (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # minimum er versjonen hacs.json lover brukerne. Feiler den, skal
        # kompatibiliteten rettes eller minimum heves med en begrunnet
        # beslutning, ikke stille.
        target: [minimum, current]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Set up just
        uses: extractions/setup-just@v4

      - name: Run real-HA tests
        run: just test-ha ${{ matrix.target }}

  # De to validatorene kjører mot `@main` og `@master` hos andre, og de snakker
  # med GitHubs API. Er de trege eller ustabile, blokkerer de releasen framfor å
  # slippe noe gjennom, og det er riktig vei å feile. Timeouten er der for at en
  # hengende validator ikke skal holde concurrency-låsen i timevis; kjør jobben
  # om igjen, flyten er gjenopptakbar.
  hacs:
    name: HACS-validering
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@master
