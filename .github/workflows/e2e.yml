name: Docker HA testlab

on:
  workflow_dispatch:
  pull_request:
    paths:
      - custom_components/stromkalkulator/**
      - tests_e2e/**
      - tests/fixtures/bkk_*_hourly.json
      - scripts/release_publish.py
      - justfile
      - .github/workflows/e2e.yml

permissions:
  contents: read

jobs:
  test-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      - name: Offline harness contracts
        run: python3 -m unittest discover -s tests_e2e -p 'test_*.py'
      - name: Full HA server and June fixture
        timeout-minutes: 28
        run: just test-e2e target=current
      - name: Always stop this job's Compose project
        if: always()
        run: python3 tests_e2e/run.py cleanup
      - name: Sanitized evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ha-e2e-current
          path: |
            tests_e2e/artifacts/*/ha.log
            tests_e2e/artifacts/*/trace.jsonl
            tests_e2e/artifacts/*/report.json
            tests_e2e/artifacts/*/version.json
          if-no-files-found: warn
          retention-days: 7
