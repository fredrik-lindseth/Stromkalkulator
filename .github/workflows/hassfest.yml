name: Hassfest (nattlig)

# Samme validator som i CI. Det publiserte Hassfest-image-et mangler ennå
# categories; den lokale actionen bygger uendret offisiell core-kilde fra en
# fastlåst revisjon. Oppdater revisjonen ved nye krav, og gå tilbake til
# standardactionen når image-et støtter feltet.

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Hassfest validation
        uses: ./.github/actions/hassfest
