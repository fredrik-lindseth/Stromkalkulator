name: Hassfest (nattlig)

# Samme begrunnelse som validate.yml: hassfest kjøres i ci.yml for hver PR og
# hver releasekandidat, og om natten her, fordi Home Assistant kan skjerpe
# kravene til manifest.json uten at vi har rørt filen.

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@master
