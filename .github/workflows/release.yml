name: Release

# Releaseporten. Alt som skal være grønt for kandidat-SHA-en, kjøres som en del
# av denne grafen (`needs: ci`), ikke som separate workflows vi håper er ferdige.
# Tidligere hang jobben på `workflow_run` fra CI, mens HACS-valideringen og
# Hassfest var egne kjøringer: en release kunne gå ut før de var ferdige, eller
# selv om de hadde feilet (stromkalkulator-2dobu6k).
#
# Kandidaten er `github.sha`, altså commiten denne kjøringen tilhører. Både CI
# og releasesteget sjekker ut nøyaktig den, så det finnes ikke et vindu der main
# kan flytte seg mellom testing, bygging og tagging (stromkalkulator-4rw6g9u).
#
# Selve flyten ligger i scripts/release_publish.py, som er testbar og
# gjenopptakbar. Draften publiseres som siste kall; feiler noe før det, finnes
# det ingen halv release å rydde, og en ny kjøring på samme SHA plukker opp der
# den slapp (stromkalkulator-5k7d7qp).

on:
  push:
    branches: [ main ]
  # Gjenopptak: «Re-run failed jobs» beholder SHA-en, eller kjør workflowen
  # manuelt på taggen. Kandidaten følger alltid av ref-en, aldri av et fritt
  # skjemafelt, så den kan ikke settes til noe CI ikke har sett.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Kjør flyten uten å skrive noe (leser bare)"
        type: boolean
        default: false

# Én publisering om gangen. cancel-in-progress står av med vilje: å avbryte en
# kjøring midt i opplastingen er nettopp halvveisen porten skal forhindre.
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

permissions: {}

jobs:
  ci:
    name: CI
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  release:
    name: Publiser
    needs: [ ci ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout kandidat-SHA
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          # ZIP-en bygges fra git-objektene, og eksisterende tagger må kunne
          # derefereres, så hele historikken og taggene må være her.
          fetch-depth: 0
          fetch-tags: true

      # Leser tilstanden på GitHub og sier om versjonen er ute fra før. Skriver
      # ingenting. Er den publisert, bevises den mot sin egen tagg og resten av
      # jobben hoppes over; er taggen på en annen commit, stopper vi her.
      - name: Les tilstanden
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release_publish.py plan --sha "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY"

      - name: Bygg deterministisk ZIP
        if: steps.plan.outputs.utfall == 'klar'
        id: bygg
        run: |
          DIGEST=$(python3 scripts/release_publish.py build --sha "$GITHUB_SHA" --output dist/stromkalkulator.zip)
          echo "sha256=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "ZIP for ${GITHUB_SHA:0:12}: $DIGEST"

      # Attestasjonen lages før noe legges ut, og verifiseres av publiseringen
      # under. Da kan ingen versjon bli offentlig med en attestasjon som peker
      # på en annen commit eller en annen fil.
      - name: Attester bygget
        if: steps.plan.outputs.utfall == 'klar'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/stromkalkulator.zip

      - name: Verifiser og publiser
        if: steps.plan.outputs.utfall == 'klar'
        env:
          GH_TOKEN: ${{ github.token }}
          # Tom på push, "true" bare når noen ba om tørrkjøring i skjemaet.
          TORRKJORING: ${{ inputs.dry_run }}
        run: |
          kommando=(
            python3 scripts/release_publish.py publish
            --sha "$GITHUB_SHA"
            --repo "$GITHUB_REPOSITORY"
            --zip dist/stromkalkulator.zip
          )
          if [ "$TORRKJORING" = "true" ]; then
            kommando+=(--dry-run)
          fi
          "${kommando[@]}"
