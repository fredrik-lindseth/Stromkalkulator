name: HACS (nattlig)

# Den samme valideringen kjøres i ci.yml for hver PR og hver releasekandidat.
# Denne kjører den om igjen om natten, fordi `hacs/action@main` og HACS' egne
# regler kan bli strengere uten at noe i repoet er endret. Da vil vi vite det
# før neste release, ikke i releasen.

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
