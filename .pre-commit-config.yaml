# Pre-commit hooks for Strømkalkulator
# Install: pip install pre-commit && pre-commit install && pre-commit install --hook-type pre-push
# Kjør en enkelt hook: pre-commit run <id> --all-files
# Repoet er ruff-format-rent fra september 2026 (line-length 110 i
# pyproject.toml), så `pre-commit run --all-files` skal ikke røre noe.

# Alt utenom testsuiten hører hjemme på commit. Uten dette kjører hele settet
# på nytt ved push, og et push av en ny gren sender alle filer gjennom
# ruff-format.
default_stages: [pre-commit]

repos:
  # Ruff - Fast Python linter and formatter
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        types_or: [python, pyi]
      - id: ruff-format
        types_or: [python, pyi]

  # Vulture - Find dead code
  - repo: https://github.com/jendrikseipp/vulture
    rev: v2.16
    hooks:
      - id: vulture
        args: [
          "custom_components/stromkalkulator",
          "vulture_whitelist.py",
          "--min-confidence", "80",
          "--exclude", "*test*",
        ]

  # Basic file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=500']

  # Mypy - Type checking (warnings only, non-blocking)
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
      - id: mypy
        args: [--ignore-missing-imports, --no-error-summary]
        files: ^custom_components/stromkalkulator/
        pass_filenames: false
        additional_dependencies: []

  # Run tests
  - repo: local
    hooks:
      - id: pytest
        name: pytest
        # Samme suite som AGENTS.md foreskriver. `language: python` gir hooken
        # sitt eget venv med hypothesis og pyyaml, slik at den ikke avhenger av
        # hva som tilfeldigvis ligger i PATH (`python` finnes ikke på alle
        # maskiner) og ikke kan gå grønn lokalt mens CI går rød på en test som
        # stille skipper.
        entry: pytest tests/ --ignore=tests/test_smoke_ha.py
        language: python
        additional_dependencies: [pytest, hypothesis, pyyaml]
        pass_filenames: false
        always_run: true
        stages: [pre-push]
