[project]
name = "stromkalkulator"
version = "1.16.0"
description = "Home Assistant integration for Norwegian electricity cost calculation"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"

[dependency-groups]
# Fire grupper, fire miljøer. `unit` og `kvalitet` kjenner ikke Home Assistant
# i det hele tatt; tests/conftest.py stubber HA bort, og en ekte homeassistant i
# samme miljø ville kollidert med stubbene. `ha-minimum` og `ha-current` er de
# to ekte-HA-miljøene, låst til hver sin plugin-versjon som selv pinner HA
# eksakt (se tabellen i docs/testing.md).
unit = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "hypothesis>=6.0.0",
    "pyyaml>=6.0",
]
# ruff er pinnet til samme versjon som .pre-commit-config.yaml bruker. Ulike
# ruff-versjoner lokalt og i hooken er et sprik som viser seg som "formateringen
# endret seg av seg selv".
kvalitet = [
    "ruff==0.16.7",
    "mypy==2.3.1",
    "vulture==2.16",
    "pre-commit>=3.5.0",
]
# Minimum = det hacs.json lover: HA 2025.1.0. Plugin-versjonen pinner
# homeassistant==2025.1.0 selv, så versjonen står bare ett sted.
ha-minimum = [
    "pytest-homeassistant-custom-component==0.13.201",
    # HA 2025.1.0 pinner denne prereleasen transitivt. uv regner bare
    # prereleases som er skrevet ut her som tillatte, så den må stå eksplisitt
    # for at minimum-grenen skal kunne løses. Samme versjon som HA ber om.
    "aiohasupervisor==0.2.2b5",
]
# Current = nyeste HA vi har sett på. Låst eksplisitt, aldri flytende:
# 0.13.365 pinner homeassistant==2026.9.2 og krever Python 3.14.
ha-current = [
    "pytest-homeassistant-custom-component==0.13.365",
]

[tool.uv]
# HA 2025.1.0 pinner aiohasupervisor==0.2.2b5, altså en prerelease. uv nekter
# prereleases som default, så minimum-grenen kunne ikke løses uten dette.
# `if-necessary-or-explicit` slipper bare gjennom de som er eksplisitt pinnet
# (eller som ikke har noe stabilt alternativ), ikke prereleases generelt.
prerelease = "if-necessary-or-explicit"
# Ingen gruppe er default. Hvert miljø skal be om det det trenger, så et
# `uv run` uten --group ikke stille drar inn noe som ikke hører hjemme der.
default-groups = []
# De to HA-gruppene kan aldri stå i samme miljø: de pinner hver sin
# homeassistant. uv løser dem som atskilte grener i uv.lock.
conflicts = [
    [{ group = "ha-minimum" }, { group = "ha-current" }],
]

[tool.uv.dependency-groups]
ha-minimum = { requires-python = ">=3.12,<3.14" }
ha-current = { requires-python = ">=3.14.2" }

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py312"
# Målt på repoet selv: 110 er bredden der `ruff format` skriver om minst mulig
# (264-272 hunks over hele spennet 104-118, minimum rundt 108-110, og omtrent
# like mye splitting som sammenslåing). 120 gjorde koden bredere enn den er
# skrevet, 100 smalere. E501 er av, så dette styrer kun formatereren.
line-length = 110

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "RUF",    # Ruff-specific rules
]
ignore = [
    "E501",   # Line too long (handled by formatter)
    "B008",   # Do not perform function calls in argument defaults
    "SIM108", # Use ternary operator (sometimes less readable)
]

[tool.ruff.lint.isort]
known-first-party = ["custom_components.stromkalkulator"]

[tool.ruff.lint.per-file-ignores]
# Ekte-HA-testene importerer HomeAssistant kun for type-hints (TC002), men
# holder den som vanlig import for lesbarhet: et type-checking-blokk i en
# testfil er mer støy enn nytte.
"tests_ha/**" = ["TC002"]
# vulture_whitelist.py er med vilje bare en liste med bare navn: det er formen
# vulture leser whitelister i, og navnene er definert i Home Assistant eller i
# integrasjonen, ikke her. Derfor er hver linje et "ubrukt uttrykk" (B018) med
# et "udefinert navn" (F821) for ruff. Unntaket gjelder kun denne filen, resten
# av sjekkene kjører som før.
"vulture_whitelist.py" = ["B018", "F821"]

[tool.vulture]
min_confidence = 80
paths = ["custom_components/stromkalkulator"]
exclude = ["*test*"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
check_untyped_defs = true
ignore_missing_imports = true  # Ignorer Home Assistant imports som ikke er installert lokalt
files = ["custom_components/stromkalkulator"]
exclude = ["tests"]
