services:
  ha:
    image: ghcr.io/home-assistant/home-assistant:2026.10.0@sha256:956a5d9effc091888cd34cb0b6fb4f66c448d257d20519e72302557682734fd0
    platform: linux/amd64
    environment:
      TZ: Europe/Oslo
    ports:
      - "127.0.0.1:${E2E_PORT:-0}:8123"
    volumes:
      - type: bind
        source: ${E2E_RUN_DIR:?}/config
        target: /config
      - type: bind
        source: ${E2E_RUN_DIR:?}/integration
        target: /config/custom_components/stromkalkulator
        read_only: true
      - type: bind
        source: ${E2E_HARNESS:?}
        target: /harness
        read_only: true
      - type: bind
        source: ${E2E_RUN_DIR:?}/fixture.json
        target: /fixture.json
        read_only: true
    stop_grace_period: 45s
    restart: "no"
    # No host network, devices, Docker socket, production config or privileges.
